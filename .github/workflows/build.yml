name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            shell: bash
            exe: ledger
          - name: macos-arm64
            os: macos-latest
            shell: bash
            exe: ledger
          - name: windows-x86_64
            os: windows-latest
            shell: msys2 {0}
            exe: ledger.exe
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            unzip
            curl
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache bundled dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        # Always use the bundled SQLite/cJSON so every platform ships a
        # self-contained binary.
        run: make USE_SYSTEM_LIBS=0

      - name: Smoke test
        run: |
          ./${{ matrix.exe }} help
          ./${{ matrix.exe }} init --db ci.db
          ./${{ matrix.exe }} company --db ci.db acme
          ./${{ matrix.exe }} chart --db ci.db --company acme
          ./${{ matrix.exe }} balance --db ci.db --company acme
          ./${{ matrix.exe }} check --db ci.db --company acme

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ matrix.name }}
          path: ${{ matrix.exe }}

  build-system-libs:
    name: linux-system-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and cJSON
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libcjson-dev
      - name: Build against system libraries
        run: make USE_SYSTEM_LIBS=1
      - name: Smoke test
        run: |
          ./ledger init --db ci.db
          ./ledger company --db ci.db acme
          ./ledger chart --db ci.db --company acme
          ./ledger check --db ci.db --company acme

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-system-libs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package binaries
        run: |
          cd dist
          for d in ledger-*; do
            (cd "$d" && chmod +x ledger* 2>/dev/null; zip -q "../$d.zip" ledger*)
          done
          ls -l *.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
