name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            shell: bash
            exe: ledger
          - name: macos-arm64
            os: macos-latest
            shell: bash
            exe: ledger
          - name: windows-x86_64
            os: windows-latest
            shell: msys2 {0}
            exe: ledger.exe
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            unzip
            curl
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache bundled dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build
        # Always use the bundled SQLite/cJSON so every platform ships a
        # self-contained binary.
        run: make USE_SYSTEM_LIBS=0

      - name: Smoke test
        run: |
          ./${{ matrix.exe }} help
          ./${{ matrix.exe }} init --db ci.db
          ./${{ matrix.exe }} company --db ci.db acme
          ./${{ matrix.exe }} chart --db ci.db --company acme
          ./${{ matrix.exe }} balance --db ci.db --company acme
          ./${{ matrix.exe }} check --db ci.db --company acme

      - name: Tests and the book's examples
        # The examples compare output byte for byte; on Windows the
        # line endings differ, so they run on Linux and macOS.
        if: runner.os != 'Windows'
        run: make USE_SYSTEM_LIBS=0 check

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ledger-${{ matrix.name }}
          path: ${{ matrix.exe }}

  build-system-libs:
    name: linux-system-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SQLite and cJSON
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libcjson-dev
      - name: Build against system libraries
        run: make USE_SYSTEM_LIBS=1
      - name: Smoke test
        run: |
          ./ledger init --db ci.db
          ./ledger company --db ci.db acme
          ./ledger chart --db ci.db --company acme
          ./ledger check --db ci.db --company acme
      - name: Tests and the book's examples
        run: make USE_SYSTEM_LIBS=1 check

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-system-libs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package binaries
        run: |
          cd dist
          for d in ledger-*; do
            (cd "$d" && chmod +x ledger* 2>/dev/null; zip -q "../$d.zip" ledger*)
          done
          ls -l *.zip

      - name: Publish binaries to the GitHub release
        # Reuses a release already created for this tag (e.g. a draft
        # made in the web UI) and only creates one if none exists.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
